# clamwake settings (zsh key=value). Read by clamwaked when it starts: restart it after a change
# (sudo brew services restart clamwake).

battery_floor=20      # mode on: sleep at or below this battery %
thermal_trip=Heavy    # Moderate | Heavy | Trapping
thermal_clear=600     # seconds of Nominal before awake again
thermal_check=30      # seconds between thermal pressure readings (while awake)
network_check=60      # seconds between home network checks
